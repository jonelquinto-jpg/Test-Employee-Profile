<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Mandatory Training Profile Dashboard</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --success: #16a34a;
      --warning: #ca8a04;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 30px 20px;
    }

    .dashboard-container {
      width: 100%;
      max-width: 1050px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top Controls / Filter Bar */
    .filter-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px 24px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .filter-label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    select.project-dropdown {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
      outline: none;
      cursor: pointer;
      min-width: 320px;
    }

    select.project-dropdown:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* Stats Overview Header Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 8px;
    }

    /* Compliance Progress Bar */
    .progress-container {
      margin-top: 12px;
      background-color: #e2e8f0;
      border-radius: 8px;
      height: 10px;
      width: 100%;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: var(--primary-color);
      width: 0%;
      transition: width 0.4s ease, background-color 0.4s ease;
      border-radius: 8px;
    }

    /* Main Content Profile Card */
    .content-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .card-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* Table Styling */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background-color: #f8fafc;
      padding: 12px 16px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-others {
      background-color: #f1f5f9;
      color: #475569;
    }

    .badge-position {
      background-color: #eff6ff;
      color: var(--primary-color);
    }

    .link-btn {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }

    .link-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Top Filter Controls -->
    <div class="filter-card">
      <div class="filter-group">
        <i class="fa-solid fa-folder-kanban" style="color: var(--primary-color);"></i>
        <label for="projectFilter" class="filter-label">Select Project Name:</label>
        <select id="projectFilter" class="project-dropdown" onchange="filterData()">
          <option value="ALL">All Projects</option>
          <option value="323300 KSP CP6-Common Indirect Costs">323300 KSP CP6-Common Indirect Costs</option>
          <option value="323524 OMPP2- SA4">323524 OMPP2- SA4</option>
        </select>
      </div>
    </div>

    <!-- Summary / Compliance Statistics -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <span>Mandatory Training Compliance</span>
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <div class="stat-value" id="complianceRate">0%</div>
        <div class="progress-container">
          <div class="progress-bar" id="complianceBar"></div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>Total Trained Personnel</span>
          <i class="fa-solid fa-users"></i>
        </div>
        <div class="stat-value" id="totalPersonnel">0</div>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">Attended mandatory sessions</p>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span>Active Topics Covered</span>
          <i class="fa-solid fa-book-open"></i>
        </div>
        <div class="stat-value" id="totalTopics">0</div>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;">Safety & Operational modules</p>
      </div>
    </div>

    <!-- Main Attendance Table -->
    <div class="content-card">
      <div class="card-title-bar">
        <h2 class="card-title">Training Attendance Log</h2>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Employee Name</th>
              <th>ID</th>
              <th>Position</th>
              <th>Topic</th>
              <th>Duration</th>
              <th>Verification</th>
            </tr>
          </thead>
          <tbody id="attendanceTableBody">
            <!-- Rendered by JavaScript -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

    // Project Target Baseline Requirements (For calculate compliance rate)
    const projectTargets = {
      "323300 KSP CP6-Common Indirect Costs": 8, // Expecting 8 trained
      "323524 OMPP2- SA4": 5                     // Expecting 5 trained
    };

    function filterData() {
      const selectedProject = document.getElementById("projectFilter").value;
      
      let filtered = attendanceData;
      if (selectedProject !== "ALL") {
        filtered = attendanceData.filter(row => row.project === selectedProject);
      }

      // Calculate Metrics & Compliance Rate
      let compliancePercentage = 0;
      if (selectedProject === "ALL") {
        const totalTarget = Object.values(projectTargets).reduce((a, b) => a + b, 0);
        compliancePercentage = Math.round((filtered.length / totalTarget) * 100);
      } else {
        const target = projectTargets[selectedProject] || filtered.length;
        compliancePercentage = Math.min(100, Math.round((filtered.length / target) * 100));
      }

      // Update Header Stats Card
      document.getElementById("complianceRate").innerText = compliancePercentage + "%";
      document.getElementById("totalPersonnel").innerText = filtered.length;

      const topics = new Set(filtered.map(item => item.topic));
      document.getElementById("totalTopics").innerText = topics.size;

      const bar = document.getElementById("complianceBar");
      bar.style.width = compliancePercentage + "%";
      
      if (compliancePercentage < 75) {
        bar.style.backgroundColor = "var(--warning)";
      } else {
        bar.style.backgroundColor = "var(--success)";
      }

      // Populate Table Body
      const tbody = document.getElementById("attendanceTableBody");
      tbody.innerHTML = "";

      filtered.forEach(row => {
        const tr = document.createElement("tr");
        
        const posClass = row.position === "Others" ? "badge-others" : "badge-position";

        tr.innerHTML = `
          <td>${row.date}</td>
          <td style="font-weight: 600;">${row.name}</td>
          <td>${row.empNo}</td>
          <td><span class="badge ${posClass}">${row.position}</span></td>
          <td>${row.topic}</td>
          <td>${row.duration} hr</td>
          <td><a href="${row.link}" target="_blank" class="link-btn"><i class="fa-solid fa-file-pdf"></i> View Source</a></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Initial load
    filterData();
  </script>
</body>
</html>
